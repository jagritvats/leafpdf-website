# leafpdf.org. Plain static files; TLS ends at the shared Traefik edge in front of this.

# Cache lifetime by path. Kept in a map so the security headers below can stay at server level: nginx drops
# inherited add_header lines in any location that declares its own.
map $uri $leaf_cache {
    ~^/img/v[0-9]+/   "public, max-age=31536000, immutable";
    ~^/icons/         "public, max-age=604800";
    ~^/assets/        "public, max-age=3600, must-revalidate";
    ~\.(?:png|svg|ico|webmanifest)$  "public, max-age=86400";
    default           "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    absolute_redirect off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain application/xml;

    # www.leafpdf.org -> leafpdf.org
    if ($host = www.leafpdf.org) {
        return 301 https://leafpdf.org$request_uri;
    }

    # Same headers as site/_headers (Cloudflare). No inline scripts or styles anywhere, so no hashes needed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src https://api.github.com; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control $leaf_cache always;

    # Cloudflare-only files; not served here.
    location ~ ^/_(headers|redirects)$ { return 404; }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # nginx's mime.types doesn't know .webmanifest. No add_header here, so the headers above still apply.
    location = /site.webmanifest { default_type application/manifest+json; }

    location = /privacy.html { return 301 /privacy/; }
    location = /download { return 302 /#download; }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
